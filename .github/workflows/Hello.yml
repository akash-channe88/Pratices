# workflow
name: Hello

# On tells when the workflow should run (Give indentation by tab) 
on:
   workflow_dispatch

# job tells what the workflow should do , there can be one or more then one jobs hence we write jobs 
# jobs is an object so needs indentation

jobs:
# 1st job (give indetation )
say-hello:
 #creates an emphemal container with Ubuntu running
 runs-on: ubuntu-latest
 steps:
     - name: say hello to everyone
       run: echo "hello desto"
       
